<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Smart Farm Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      font-family: 'Kanit', sans-serif;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 25px 30px;
      border-radius: 20px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .status {
      text-align: center;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .sensor {
      background: rgba(0,0,0,0.2);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    .on {
      background: #00e676;
      color: #004d40;
    }

    .off {
      background: #ff5252;
      color: #4a0000;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .ok { color: #00e676; }
    .bad { color: #ff5252; }
  </style>
</head>
<body>

        <span id="onlineText">-</span>
      </div>
      <div class="row">
        <span>🌱 ความชื้นดิน</span>
        <span id="soilText">- %</span>
      </div>
      <div class="row">
        <span>🌡 อุณหภูมิ</span>
        <span id="tempText">- °C</span>
      </div>
      <div class="row">
        <span>🚨 Alarm</span>
        <span id="alarmText">-</span>
      </div>
    </div>

    <button class="btn" id="toggleBtn">...</button>
  </div>
